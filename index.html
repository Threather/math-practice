<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Math Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: a sum written in column form on graph paper, the way it's done by hand */
  :root {
    --paper:#fbfcfd; --grid:#e3eaf2; --ink:#1b2430; --pencil:#8592a3; --right:#2f8a57; --wrong:#c8423b;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
    --sans:"IBM Plex Sans", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --paper:#11161d; --grid:#1b232d; --ink:#e7ecf2; --pencil:#66727f; --right:#5cc68a; --wrong:#ef6e66; color-scheme:dark; } }
  :root[data-theme="dark"] {
    --paper:#11161d; --grid:#1b232d; --ink:#e7ecf2; --pencil:#66727f; --right:#5cc68a; --wrong:#ef6e66; color-scheme:dark; }

  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; display:grid; place-items:center;
    padding-block:24px; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
    background-color:var(--paper); color:var(--ink); font-family:var(--sans);
    background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:28px 28px;
  }
  .score {
    position:fixed; top:calc(20px + env(safe-area-inset-top, 0px)); left:0; right:0; text-align:center;
    font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--pencil);
  }
  .score b { font-family:var(--mono); font-weight:500; color:var(--ink); letter-spacing:0; }

  .sum {
    font-family:var(--mono); font-size:clamp(48px, 13vw, 84px); line-height:1.15;
    font-variant-numeric:tabular-nums; display:grid; justify-items:end; width:5.5ch;
  }
  .sum .op { color:var(--pencil); margin-right:.5ch; }
  .rule { width:100%; height:2px; background:var(--ink); margin:8px 0 4px; }
  input {
    width:100%; font:inherit; text-align:right; color:var(--ink); background:transparent;
    border:0; padding:0; outline:none; caret-color:var(--pencil); -moz-appearance:textfield;
  }
  input::placeholder { color:var(--grid); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .sum.right input { color:var(--right); }
  .sum.wrong input { color:var(--wrong); text-decoration:line-through; text-decoration-thickness:3px; }

  .fb { height:20px; margin-top:20px; font-size:15px; color:var(--pencil); text-align:right; font-family:var(--mono); }
  .fb.wrong { color:var(--wrong); }
  .fb.right { color:var(--right); }
  .wrap { display:grid; }
</style>
</head>
<body>
<div class="score">Score <b id="score">0/0</b> &nbsp; Streak <b id="streak">0</b></div>
<div class="wrap">
  <form class="sum" id="form">
    <div id="a"></div>
    <div><span class="op" id="op"></span><span id="b"></span></div>
    <div class="rule"></div>
    <input id="ans" type="number" inputmode="numeric" autocomplete="off" placeholder="?" autofocus aria-label="Your answer">
  </form>
  <div class="fb" id="fb"></div>
</div>
<script>
const $ = id => document.getElementById(id);
let current, correct = 0, total = 0, streak = 0, locked = false;

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function makeQuestion() {
  const op = ['+', '−', '×', '÷'][randInt(0, 3)];
  let a, b, answer;
  if (op === '+') { a = randInt(1, 100); b = randInt(1, 100); answer = a + b; }
  if (op === '−') { a = randInt(1, 100); b = randInt(1, a); answer = a - b; }
  if (op === '×') { a = randInt(1, 12); b = randInt(1, 12); answer = a * b; }
  if (op === '÷') { b = randInt(1, 12); answer = randInt(1, 12); a = b * answer; }
  return { a, op, b, answer };
}

function render(q) {
  $('a').textContent = q.a;
  $('op').textContent = q.op;
  $('b').textContent = q.b;
  $('form').className = 'sum';
  $('fb').className = 'fb';
  $('fb').textContent = '';
  $('ans').value = '';
  $('ans').focus();
  locked = false;
}

function check(value) {
  if (locked || value === '') return;
  locked = true;
  const right = Number(value) === current.answer;
  total++;
  if (right) { correct++; streak++; } else { streak = 0; }
  $('score').textContent = `${correct}/${total}`;
  $('streak').textContent = streak;
  $('form').className = 'sum ' + (right ? 'right' : 'wrong');
  $('fb').className = 'fb ' + (right ? 'right' : 'wrong');
  $('fb').textContent = right ? 'correct' : `answer: ${current.answer}`;
  setTimeout(next, right ? 700 : 1600);
}

function next() {
  current = makeQuestion();
  render(current);
}

$('form').onsubmit = e => { e.preventDefault(); check($('ans').value); };
next();
</script>
</body>
</html>
