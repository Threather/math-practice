<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Practice</title>
<style>
  :root { --bg:#fafafa; --fg:#111; --muted:#a0a0a0; --line:#e0e0e0; --yes:#2e9e5b; --no:#d9534f; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0e0e10; --fg:#f2f2f2; --muted:#5c5c63; --line:#26262b; } }
  :root[data-theme="dark"] { --bg:#0e0e10; --fg:#f2f2f2; --muted:#5c5c63; --line:#26262b; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif; padding:16px; }
  .score { position:fixed; top:24px; font-size:13px; letter-spacing:.08em; color:var(--muted); font-variant-numeric:tabular-nums; }
  .q { font-size:clamp(44px,11vw,88px); font-weight:300; letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  input { margin-top:32px; width:min(240px,80vw); font:inherit; font-size:40px; font-weight:300; text-align:center;
          color:var(--fg); background:transparent; border:0; border-bottom:1px solid var(--line); padding:8px 0;
          outline:none; transition:border-color .2s; -moz-appearance:textfield; }
  input:focus { border-bottom-color:var(--fg); }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .fb { height:24px; margin-top:24px; font-size:15px; }
</style>
</head>
<body>
<div class="score"><span id="score">0 / 0</span> &nbsp;·&nbsp; streak <span id="streak">0</span></div>
<div class="q" id="q"></div>
<form id="form">
  <input id="ans" type="number" inputmode="numeric" autocomplete="off" autofocus>
</form>
<div class="fb" id="fb"></div>
<script>
const $ = id => document.getElementById(id);
let current, correct = 0, total = 0, streak = 0, locked = false;

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

function makeQuestion() {
  const op = ['+', '−', '×', '÷'][randInt(0, 3)];
  let a, b, answer;
  if (op === '+') { a = randInt(1, 100); b = randInt(1, 100); answer = a + b; }
  if (op === '−') { a = randInt(1, 100); b = randInt(1, a); answer = a - b; }
  if (op === '×') { a = randInt(1, 12); b = randInt(1, 12); answer = a * b; }
  if (op === '÷') { b = randInt(1, 12); answer = randInt(1, 12); a = b * answer; }
  return { a, op, b, answer };
}

function render(q) {
  $('q').textContent = `${q.a} ${q.op} ${q.b}`;
  $('fb').textContent = '';
  $('ans').value = '';
  $('ans').focus();
  locked = false;
}

function check(value) {
  if (locked || value === '') return;
  locked = true;
  const right = Number(value) === current.answer;
  total++;
  if (right) { correct++; streak++; } else { streak = 0; }
  $('score').textContent = `${correct} / ${total}`;
  $('streak').textContent = streak;
  const c = current;
  $('fb').style.color = right ? 'var(--yes)' : 'var(--no)';
  $('fb').textContent = right ? 'Correct' : `${c.a} ${c.op} ${c.b} = ${c.answer}`;
  setTimeout(next, right ? 700 : 1600);
}

function next() {
  current = makeQuestion();
  render(current);
}

$('form').onsubmit = e => { e.preventDefault(); check($('ans').value); };
next();
</script>
</body>
</html>
